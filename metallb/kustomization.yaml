# MetalLB install layer: namespace + Helm source + HelmRelease only.
# The IPAddressPools / L2Advertisement live in ../network so they can be
# sequenced AFTER the metallb CRDs exist (see flux/wiring.example.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
