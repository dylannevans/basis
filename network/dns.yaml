apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dns
  namespace: flux-system
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: dns
    app.kubernetes.io/component: frontend
    entity: cluster
    env: dev
    capability: dns
spec:
  interval: 12h
  chart:
    spec:
      chart: pihole
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: flux-system
      interval: 12h
  targetNamespace: cluster-named-dns
  install:
    createNamespace: true
  values:
    image:
      tag: latest
    virtualHost: dns.${DOMAIN}
    dnsmasq:
      customSettings:
        # ${K8S_GATEWAY_IP:=...} carries an inline default on purpose. Flux
        # substitutes the whole build BEFORE applying it, so on the first
        # reconcile after this lands, the in-cluster basis-vars ConfigMap is
        # still the old one that has only DOMAIN — the new key does not exist
        # yet, because the ConfigMap that defines it is applied by this very
        # pass. An undefined ${var} renders as the EMPTY STRING, which would
        # ship "server=/famevans.win/" to dnsmasq for one interval. The default
        # makes that pass render the correct address instead.
        - "server=/${DOMAIN}/${K8S_GATEWAY_IP:=10.43.171.237}"
        - "dhcp-authoritative"
        - "domain=lan"
        - "expand-hosts"
        - "dhcp-range=::100,::200,constructor:eth0,ra-names,64,12h"
        - "dhcp-option=option6:dns-server,[fdaa:1111:2222:3333::2]"
        - "dhcp-option=option6:domain-search,lan,${DOMAIN}"
        - "dhcp-option=option6:23,[fdaa:1111:2222:3333::2]"
        - "dhcp-option=option6:39"
        - "enable-ra"
    podDnsConfig:
      enabled: false
    admin:
      enabled: true
      adminPassword: dummy
    extraEnvVars:
      FTLCONF_dhcp_active: "true"
      FTLCONF_dhcp_start: 192.168.1.100
      FTLCONF_dhcp_end: 192.168.1.200
      FTLCONF_dhcp_router: 192.168.1.1
      FTLCONF_dhcp_netmask: "255.255.255.0"
      FTLCONF_dhcp_leasetime: "24"
      FTLCONF_dns_domain: lan
      FTLCONF_webserver_port: 80,[::]:80
      FTLCONF_dhcp_ipv6: "true"
    privileged: "true"
    # The UI gets its own metallb LoadBalancer IP (shares dns-pool's single
    # address with the manual DNS/DHCP Service below) and terminates TLS
    # in-pod via lighttpd — no ingress controller involved, so this repo has
    # no traefik dependency. See extraVolumes/extraObjects below.
    serviceWeb:
      type: LoadBalancer
      http:
        enabled: true
      https:
        enabled: true
      annotations:
        metallb.universe.tf/address-pool: dns-pool
        metallb.universe.tf/allow-shared-ip: pihole-svc
    serviceDns:
      type: ClusterIP
    serviceDhcp:
      type: ClusterIP
      enabled: true
    persistentVolumeClaim:
      size: 2Gi
      storageClass: ""
      enabled: true
    extraVolumes:
      tls-cert:
        secret:
          secretName: famevans-tls
      external-conf-cm:
        configMap:
          name: pihole-lighttpd-external-conf
      external-conf:
        emptyDir: {}
    extraVolumeMounts:
      tls-cert:
        mountPath: /etc/ssl/lighttpd-private
        readOnly: true
      external-conf:
        mountPath: /etc/lighttpd/external.conf
        subPath: external.conf
    extraInitContainers:
      - name: copy-lighttpd-conf
        image: busybox:stable
        command:
          - sh
          - -c
          - cp /etc/lighttpd-cm/external.conf /etc/lighttpd/external.conf
        volumeMounts:
          - name: external-conf-cm
            mountPath: /etc/lighttpd-cm/
          - name: external-conf
            mountPath: /etc/lighttpd/
    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: pihole-lighttpd-external-conf
        data:
          external.conf: |
            $HTTP["host"] =~ "dns.${DOMAIN}" {
              setenv.add-environment = ("fqdn" => "true")
              $SERVER["socket"] == ":443" {
                ssl.engine = "enable"
                ssl.pemfile = "/etc/ssl/lighttpd-private/tls.crt"
                ssl.privkey = "/etc/ssl/lighttpd-private/tls.key"
              }
            }
            $HTTP["scheme"] == "http" {
              $HTTP["host"] =~ ".*" {
                url.redirect = (".*" => "https://%0$0")
              }
            }
---
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: cluster-named-dns
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: dns
    app.kubernetes.io/component: frontend
    entity: cluster
    env: dev
    capability: dns
  annotations:
    metallb.universe.tf/address-pool: dns-pool
    metallb.universe.tf/allow-shared-ip: pihole-svc
spec:
  type: LoadBalancer
  # PreferDualStack alone, with no explicit ipFamilies (dylannevans/basis#7).
  # ipFamilies is a hard requirement rather than a preference: naming IPv6 there
  # made the whole Service invalid on an IPv4-only cluster ("spec.ipFamilies[1]:
  # Invalid value: 'IPv6': not configured on this cluster"), which took
  # fe-basis-network down with it. PreferDualStack still gets both families
  # wherever the cluster provides them, so the dhcpv6-udp port below is served
  # on a dual-stack cluster and simply has no v6 address to bind on a
  # single-stack one — degraded rather than rejected.
  ipFamilyPolicy: PreferDualStack
  selector:
    app: pihole
    release: cluster-named-dns-dns
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dhcp-udp
      port: 67
      protocol: UDP
      targetPort: client-udp
    - name: dhcpv6-udp
      port: 547
      protocol: UDP
      targetPort: 547
  externalTrafficPolicy: Local
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: flux-system
  labels:
    app.kubernetes.io/name: cluster-upstream
    app.kubernetes.io/part-of: dns
    app.kubernetes.io/component: upstream
    entity: cluster
    env: dev
    capability: dns
spec:
  interval: 12h
  chart:
    spec:
      chart: k8s-gateway
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
      interval: 12h
  targetNamespace: cluster-named-dns
  install:
    createNamespace: true
  values:
    domain: ${DOMAIN}
    image:
      tag: latest
    watchedResources:
      - Service
      - Ingress
    # Enable fallthrough so k8s_gateway passes unknown queries to next plugin
    fallthrough:
      enabled: true
      zones:
        - ${DOMAIN}
    # Zone file with CNAME records for short DNS names
    zoneFiles:
      - filename: short-names.db
        domains: ${DOMAIN}
        contents: |
          $ORIGIN ${DOMAIN}.
          @    IN SOA cluster-named-dns-k8s-gateway.cluster-named-dns.svc.cluster.local. admin.${DOMAIN}. (
              2024092401 ; serial
              3600       ; refresh
              1800       ; retry
              604800     ; expire
              300        ; minimum
          )

          ; Short name CNAME records
          mcp-k8s  IN CNAME mcp-k8s.cluster-named-svcs.${DOMAIN}.
          fs       IN CNAME fs.cluster-named-svcs.${DOMAIN}.
          #mcp-pw   IN CNAME mcp-pw.cluster-named-svcs.${DOMAIN}.
    extraZonePlugins:
      - name: log
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . /etc/resolv.conf
      - name: loop
      - name: reload
      - name: loadbalance
    service:
      type: ClusterIP
      useTcp: true
