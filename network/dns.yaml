apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dns
  namespace: flux-system
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: dns
    app.kubernetes.io/component: frontend
    entity: cluster
    env: dev
    capability: dns
spec:
  interval: 12h
  chart:
    spec:
      chart: pihole
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: flux-system
      interval: 12h
  targetNamespace: cluster-named-dns
  install:
    createNamespace: true
  values:
    image:
      tag: latest
    virtualHost: dns.${DOMAIN}
    dnsmasq:
      customSettings:
        # ${K8S_GATEWAY_IP:=...} carries an inline default on purpose. Flux
        # substitutes the whole build BEFORE applying it, so on the first
        # reconcile after this lands, the in-cluster basis-vars ConfigMap is
        # still the old one that has only DOMAIN — the new key does not exist
        # yet, because the ConfigMap that defines it is applied by this very
        # pass. An undefined ${var} renders as the EMPTY STRING, which would
        # ship "server=/famevans.win/" to dnsmasq for one interval. The default
        # makes that pass render the correct address instead.
        - "server=/${DOMAIN}/${K8S_GATEWAY_IP:=10.43.230.226}"
        - "dhcp-authoritative"
        - "domain=lan"
        - "expand-hosts"
        - "dhcp-range=::100,::200,constructor:eth0,ra-names,64,12h"
        - "dhcp-option=option6:dns-server,[${DNS_VIP6:=fdaa:3c:a129:8f42::2}]"
        - "dhcp-option=option6:domain-search,lan,${DOMAIN}"
        - "dhcp-option=option6:23,[${DNS_VIP6:=fdaa:3c:a129:8f42::2}]"
        - "dhcp-option=option6:39"
        - "enable-ra"
    podDnsConfig:
      enabled: false
    admin:
      enabled: true
      adminPassword: dummy
    extraEnvVars:
      FTLCONF_dhcp_active: "true"
      FTLCONF_dhcp_start: "${DHCP_START:=192.168.1.100}"
      FTLCONF_dhcp_end: "${DHCP_END:=192.168.1.200}"
      FTLCONF_dhcp_router: "${LAN_ROUTER:=192.168.1.1}"
      FTLCONF_dhcp_netmask: "${LAN_NETMASK:=255.255.255.0}"
      FTLCONF_dhcp_leasetime: "24"
      FTLCONF_dns_domain: lan
      FTLCONF_webserver_port: 80,[::]:80
      FTLCONF_dhcp_ipv6: "true"
      # Pinned explicitly (dylannevans/basis#11) rather than left to the
      # mojo2600 pihole chart's default (charts/pihole/values.yaml DNS1/DNS2),
      # which happens to already be this value. This must NEVER be
      # 192.168.1.2 (dns-pool, this pod's own Service IP) or anything else
      # the cluster serves: pihole forwarding to itself would recreate the
      # self-referential resolver loop in #9, just one level down the stack
      # from where #9 actually bites (the node's resolver, not pihole's
      # upstream). Keep this a static public resolver.
      FTLCONF_dns_upstreams: 8.8.8.8;8.8.4.4
    privileged: "true"
    # The UI gets its own metallb LoadBalancer IP (shares dns-pool's single
    # address with the manual DNS/DHCP Service below) and terminates TLS
    # in-pod via lighttpd — no ingress controller involved, so this repo has
    # no traefik dependency. See extraVolumes/extraObjects below.
    serviceWeb:
      type: LoadBalancer
      http:
        enabled: true
      https:
        enabled: true
      annotations:
        metallb.universe.tf/address-pool: dns-pool
        metallb.universe.tf/allow-shared-ip: pihole-svc
    serviceDns:
      type: ClusterIP
    serviceDhcp:
      type: ClusterIP
      enabled: true
    persistentVolumeClaim:
      size: 2Gi
      storageClass: ""
      enabled: true
    extraVolumes:
      tls-cert:
        secret:
          secretName: famevans-tls
          # optional, because this pod IS the LAN's resolver and famevans-tls is
          # issued by ACME DNS-01 — which needs working DNS to reach Let's
          # Encrypt. Without `optional` a cold cluster deadlocks permanently:
          # kubelet holds the pod at Init on "secret famevans-tls not found",
          # so the `dns` Service has no endpoints, so every lookup that would
          # let cert-manager create the Order fails. See dylannevans/basis#9.
          #
          # An existing cluster never sees this — k1 has held famevans-tls since
          # it was issued while DNS was already up — so it only bites a rebuild.
          optional: true
      external-conf-cm:
        configMap:
          name: pihole-lighttpd-external-conf
      external-conf:
        emptyDir: {}
    extraVolumeMounts:
      tls-cert:
        mountPath: /etc/ssl/lighttpd-private
        readOnly: true
      external-conf:
        mountPath: /etc/lighttpd/external.conf
        subPath: external.conf
    extraInitContainers:
      - name: copy-lighttpd-conf
        image: busybox:stable
        # Marking the tls-cert volume optional is necessary but not sufficient:
        # with the Secret absent the mount is simply an empty dir, and lighttpd
        # refuses to start when ssl.engine is enabled and ssl.pemfile does not
        # exist. That would swap a stuck Init for a CrashLoopBackOff and leave
        # the deadlock exactly where it was, so the conf has to match reality.
        #
        # Serve plain HTTP until the cert shows up. DNS on :53 is unaffected
        # either way — it is lighttpd, not FTL, that cares about the cert — so
        # this trades the admin UI's TLS for a cluster that can bootstrap at
        # all. cert-manager then issues over working DNS and the next restart
        # picks up the full config.
        command:
          - sh
          - -c
          - |
            set -eu
            if [ -s /etc/ssl/lighttpd-private/tls.crt ]; then
              cp /etc/lighttpd-cm/external.conf /etc/lighttpd/external.conf
              echo "tls.crt present — serving the admin UI over HTTPS"
            else
              echo "tls.crt absent — serving the admin UI over plain HTTP so DNS can start"
              echo "  (expected only until cert-manager issues famevans-tls; see basis#9)"
              cat > /etc/lighttpd/external.conf <<'HTTPONLY'
            $HTTP["host"] =~ "dns.${DOMAIN}" {
              setenv.add-environment = ("fqdn" => "true")
            }
            HTTPONLY
            fi
        volumeMounts:
          - name: external-conf-cm
            mountPath: /etc/lighttpd-cm/
          - name: external-conf
            mountPath: /etc/lighttpd/
          # Read-only peek at the cert so the branch above can be taken. Same
          # optional Secret as the main container; an absent Secret mounts empty
          # rather than blocking, which is the whole point.
          - name: tls-cert
            mountPath: /etc/ssl/lighttpd-private
            readOnly: true
    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: pihole-lighttpd-external-conf
        data:
          external.conf: |
            $HTTP["host"] =~ "dns.${DOMAIN}" {
              setenv.add-environment = ("fqdn" => "true")
              $SERVER["socket"] == ":443" {
                ssl.engine = "enable"
                ssl.pemfile = "/etc/ssl/lighttpd-private/tls.crt"
                ssl.privkey = "/etc/ssl/lighttpd-private/tls.key"
              }
            }
            $HTTP["scheme"] == "http" {
              $HTTP["host"] =~ ".*" {
                url.redirect = (".*" => "https://%0$0")
              }
            }
---
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: cluster-named-dns
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/part-of: dns
    app.kubernetes.io/component: frontend
    entity: cluster
    env: dev
    capability: dns
  annotations:
    metallb.universe.tf/address-pool: dns-pool
    metallb.universe.tf/allow-shared-ip: pihole-svc
spec:
  type: LoadBalancer
  # PreferDualStack alone, with no explicit ipFamilies (dylannevans/basis#7).
  # ipFamilies is a hard requirement rather than a preference: naming IPv6 there
  # made the whole Service invalid on an IPv4-only cluster ("spec.ipFamilies[1]:
  # Invalid value: 'IPv6': not configured on this cluster"), which took
  # fe-basis-network down with it. PreferDualStack still gets both families
  # wherever the cluster provides them, so the dhcpv6-udp port below is served
  # on a dual-stack cluster and simply has no v6 address to bind on a
  # single-stack one — degraded rather than rejected.
  ipFamilyPolicy: PreferDualStack
  selector:
    # `app: pihole` ONLY. Do not re-add `release:`.
    #
    # The obvious-looking second label would be `release: cluster-named-dns-dns`,
    # copying what the chart puts on its own Services. But that string is not a
    # name anyone chose — helm-controller derives releaseName as
    # <targetNamespace>-<metadata.name>, so it silently encodes the namespace
    # into this selector. Rename the namespace or the HelmRelease and the pods'
    # `release` label moves while this does not.
    #
    # The failure is silent, which is what makes it worth a comment: the Service
    # still gets its MetalLB address, still reports type: LoadBalancer with an
    # ingress IP, and still passes every Flux health check — it just has zero
    # endpoints, and LAN DNS/DHCP black-holes with no error anywhere. That is
    # the same shape as the #9 deadlock, reached by a rename instead of a cold
    # start. This repo is slated to drop `named` from its object names, so the
    # tripwire sits directly on a planned change. simplesalt/projects#315.
    #
    # `app` is the chart-name label and no nameOverride is set, so this selects
    # the same pods. `release` would only earn its place if a second pihole
    # release shared the namespace, which is not planned.
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dhcp-udp
      port: 67
      protocol: UDP
      targetPort: client-udp
    - name: dhcpv6-udp
      port: 547
      protocol: UDP
      targetPort: 547
  externalTrafficPolicy: Local
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: flux-system
  labels:
    app.kubernetes.io/name: cluster-upstream
    app.kubernetes.io/part-of: dns
    app.kubernetes.io/component: upstream
    entity: cluster
    env: dev
    capability: dns
spec:
  interval: 12h
  chart:
    spec:
      chart: k8s-gateway
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: flux-system
      interval: 12h
  targetNamespace: cluster-named-dns
  install:
    createNamespace: true
  values:
    domain: ${DOMAIN}
    image:
      tag: latest
    watchedResources:
      - Service
      - Ingress
    # Enable fallthrough so k8s_gateway passes unknown queries to next plugin
    fallthrough:
      enabled: true
      zones:
        - ${DOMAIN}
    # Zone file with CNAME records for short DNS names
    zoneFiles:
      - filename: short-names.db
        domains: ${DOMAIN}
        contents: |
          $ORIGIN ${DOMAIN}.
          @    IN SOA cluster-named-dns-k8s-gateway.cluster-named-dns.svc.cluster.local. admin.${DOMAIN}. (
              2024092401 ; serial
              3600       ; refresh
              1800       ; retry
              604800     ; expire
              300        ; minimum
          )

          ; Short name CNAME records
          mcp-k8s  IN CNAME mcp-k8s.cluster-named-svcs.${DOMAIN}.
          fs       IN CNAME fs.cluster-named-svcs.${DOMAIN}.
          #mcp-pw   IN CNAME mcp-pw.cluster-named-svcs.${DOMAIN}.
    extraZonePlugins:
      - name: log
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . /etc/resolv.conf
      - name: loop
      - name: reload
      - name: loadbalance
    service:
      type: ClusterIP
      # PINNED, not observed. dnsmasq above forwards the whole ${DOMAIN} zone to
      # this address, so it has to be a value we assert rather than one we read
      # off a running cluster and copy down. Chart gates this on
      # type == ClusterIP, which is what we set. dylannevans/basis#15.
      clusterIP: "${K8S_GATEWAY_IP:=10.43.230.226}"
      useTcp: true
