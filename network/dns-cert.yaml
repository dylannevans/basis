# TLS cert for the pihole admin UI (dns.${DOMAIN}), issued into the
# cluster-named-dns namespace as the `famevans-tls` secret. pihole mounts this
# secret directly and terminates TLS itself (see network/dns.yaml) — there is
# no ingress controller in front of it.
#
# The `famevans` ClusterIssuer (+ fe-acme-cf-token) it references now lives in
# basis too (famevans-issuer.yaml). basis still assumes cert-manager itself
# (CRDs + controller) is provided by base-stack (1.basis).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: famevans-tls-dns
  namespace: cluster-named-dns
  labels:
    app.kubernetes.io/name: UI-cert
    app.kubernetes.io/part-of: fe-UI
    app.kubernetes.io/component: cert
    entity: cluster
    env: dev
    capability: dns
spec:
  secretName: famevans-tls
  issuerRef:
    name: famevans
    kind: ClusterIssuer
  commonName: dns.${DOMAIN}
  dnsNames:
    - dns.${DOMAIN}
