# MetalLB address pools + L2 (ARP) advertisement.
#
# Long-term cluster network strategy: metallb in BGP mode. Nodes use DHCP when
# provisioning; if not, 192.168.1.99 and fdaa:3c7e:a129:8f41::/64 (EUI-64).
# metallb pool: fdaa:3c7e:a129:8f42::/64 + 192.168.1.32-192.168.1.254.
# Once the first node is up, the DHCP container provides IPs to everything else.
#
# NOTE ON kube-vip: the apiserver VIP is handled separately by a kube-vip
# DaemonSet in the k3s static-manifests dir (multi-server HA image). That is the
# CONTROL-PLANE VIP. The pools below are SERVICE LoadBalancer IPs — a distinct
# concern kube-vip does not cover in that configuration. Do not remove metallb
# on the assumption kube-vip replaces it.
#
# NOTE ON traefik: there is deliberately no `traefik` pool/HelmChartConfig here
# anymore. Traefik (k3s built-in, lives in base-stack) does not need a LAN VIP —
# cf-tunnel already reaches it via its ClusterIP Service DNS name, and the
# pihole UI (network/dns.yaml) now gets its own dedicated LoadBalancer IP and
# terminates TLS itself instead of routing through an ingress controller. If a
# consumer needs traefik reachable on the LAN too, give it its own
# Service/annotation against `fe-apps` — don't reintroduce a basis->traefik
# coupling here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metallb-ready
  namespace: metallb-system
  labels:
    entity: cluster
    capability: basis
  annotations:
    kustomize.toolkit.fluxcd.io/health: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: ipaddresspools.metallb.io
      status:
        conditions:
        - type: Established
          status: "True"
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dns-pool
  namespace: metallb-system
  labels:
    entity: cluster
    env: named
    capability: dns
spec:
  autoAssign: false
  addresses:
    - ${DNS_VIP:=192.168.1.2}/32
    # NOTE the prefix here is fdaa:3c:... while fe-apps below and the comment at
    # the top of this file both use fdaa:3c7e:... — a one-nibble difference that
    # puts the DNS VIP on a different /64 from every application Service.
    # Preserved exactly as-is here because changing it moves the LAN's live DNS
    # address; see dylannevans/basis#19 for the decision.
    - ${DNS_VIP6:=fdaa:3c:a129:8f42::2}/128
  serviceAllocation:
    serviceSelectors:
      - matchLabels:
          app.kubernetes.io/name: pihole
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: fe-apps
  namespace: metallb-system
  labels:
    entity: fe
    env: named
    capability: access
spec:
  autoAssign: false
  addresses:
    - ${APPS_POOL_V4:=192.168.1.32-192.168.1.64}
    - ${APPS_POOL_V6:=fdaa:3c7e:a129:8f42::32-fdaa:3c7e:a129:8f42::64}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: advertisement
  namespace: metallb-system
  labels:
    entity: cluster
    capability: basis
spec:
  ipAddressPools:
    - dns-pool
    - fe-apps
