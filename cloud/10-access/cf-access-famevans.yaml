# Cloudflare Zero Trust — the famevans (personal / evans-home) Access identity,
# moved out of simplesalt/base-stack (2.access/cf-zero-trust-*). These are
# crossplane-managed Cloudflare resources.
#
# CROSS-REPO DEPENDENCY: needs the crossplane Cloudflare zero-trust provider
# (zero.upjet-cloudflare.upbound.io) + ProviderConfig `default`, both installed
# by base-stack. So basis-cloud must reconcile after base-stack's `access` layer
# (wired via dependsOn in base-stack order.yaml). basis does NOT install the
# provider.
#
# What stays in base-stack: the SS SSO IdP (@simplesalt.company) and the App
# Launcher — those are simplesalt, not famevans.
#
# TEMPLATING (basis-cloud Kustomization, see flux/wiring.example.yaml):
# accountId and the team domain below are substituted from the
# basis-cloud-vars ConfigMap (cloud/vars.yaml) via postBuild.substituteFrom —
# ${CF_ACCOUNT_ID} / ${CF_ACCESS_TEAM}, committed defaults equal to the
# previous hardcoded evans-home values, so this is byte-identical until
# someone overrides the ConfigMap. The three UUIDs below (external-name,
# allowedIdps famevans IdP, policy id) are deliberately left hardcoded, NOT
# templated: they are crossplane.io/external-name-class identifiers that
# adopt a specific LIVE Cloudflare object. If postBuild substitution were
# ever misconfigured, a templated identity UUID could make crossplane
# re-point or fail to adopt the live resource — accountId/domain are plain
# data fields with no such adoption risk, so only those are templated here.
---
# Warp Login App — personal WARP VPN, gated by the famevans Google IdP.
# LIVE + adopted (crossplane.io/external-name = the existing CF app UUID), so:
#   * external-name keeps this pointing at the real CF app (no re-create).
#   * deletionPolicy: Orphan means if this MR is ever pruned, crossplane detaches
#     but does NOT delete the CF-side app. Added because moving a live MR between
#     Flux Kustomizations risks a destructive prune — see base-stack order.yaml
#     handoff note (subscribe basis first so basis-cloud adopts/relabels this MR
#     before base-stack's `access` prune runs).
apiVersion: zero.upjet-cloudflare.upbound.io/v1alpha1
kind: TrustAccessApplication
metadata:
  annotations:
    crossplane.io/external-name: cd1dd3f6-6bfb-44cd-91c8-2a751fae13e3
  name: cloudflare-app-warp-login
  labels:
    entity: fe
    capability: access
spec:
  deletionPolicy: Orphan
  forProvider:
    accountId: ${CF_ACCOUNT_ID}
    name: Warp Login App
    type: warp
    domain: ${CF_ACCESS_TEAM}/warp
    sessionDuration: 24h
    autoRedirectToIdentity: true
    allowedIdps:
      - 2aa0fe06-a4df-470d-97ae-09dd4dbc036e  # famevans IdP
    policies:
      - id: 3658e5f4-2432-4a33-bd2b-7bdd15d175ee
        precedence: 1
  providerConfigRef:
    name: default
---
