# ---------------------------------------------------------------------------
# EXAMPLE wiring — this file belongs in *base-stack*, not basis. It is kept here
# for reference. Drop it into base-stack/flux-system (or order.yaml) to subscribe
# the cluster to this repo, then comment out the duplicated metallb + DNS
# resources in base-stack (see README.md "Cutover" section).
#
# It mirrors base-stack's own basis->access sequencing: install the metallb
# chart first, then apply the pools/DNS once the metallb CRDs are Established.
# ---------------------------------------------------------------------------
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: basis
  namespace: flux-system
  labels:
    entity: cluster
    capability: basis
spec:
  url: https://github.com/dylannevans/basis
  interval: 1m
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: basis-metallb
  namespace: flux-system
spec:
  interval: 1m
  path: ./metallb
  prune: true
  sourceRef:
    kind: GitRepository
    name: basis
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metallb
      namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: basis-network
  namespace: flux-system
spec:
  dependsOn:
    - name: basis-metallb
  interval: 1m
  path: ./network
  prune: true
  sourceRef:
    kind: GitRepository
    name: basis
  timeout: 5m
  # metallb-pools.yaml carries a `metallb-ready` ConfigMap whose
  # kustomize.toolkit.fluxcd.io/health annotation blocks readiness until the
  # ipaddresspools.metallb.io CRD is Established — belt-and-suspenders with the
  # dependsOn above.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: basis-vars
        # basis ships network/vars.yaml with DOMAIN: famevans.win as the
        # committed default. To point basis at a different LAN, override it —
        # e.g. a Kustomize patch on vars.yaml in the consuming repo, or a
        # ConfigMap generator layered after this Kustomization's path.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: basis-cloud
  namespace: flux-system
spec:
  interval: 1m
  path: ./cloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: basis
  timeout: 5m
  # CROSS-REPO DEPENDENCY (not expressible here): cloud/ needs the crossplane
  # Cloudflare zero-trust provider + ProviderConfig `default`, both installed
  # by base-stack's `access` layer — wire a dependsOn on that Kustomization's
  # name in base-stack's own order.yaml, the same handoff basis-network does
  # for metallb. basis does NOT install the provider.
  #
  # No dependsOn on basis-metallb/basis-network here: cloud/ (personal
  # evans-home Cloudflare account) and network/ (LAN metallb+DNS) are
  # independent layers, so basis-cloud uses its own vars ConfigMap
  # (basis-cloud-vars, below) instead of basis-vars — reusing basis-vars
  # would force an artificial ordering dependency on basis-network purely so
  # the ConfigMap exists, which is the coupling this repo's layering is meant
  # to avoid. See README "Cluster-independence".
  postBuild:
    substituteFrom:
      # DO NOT add `optional: true` here. It looks like the obvious fix the
      # first time this Kustomization reports `configmaps "basis-cloud-vars"
      # not found` — but Flux's substitution is envsubst-shaped: an unresolved
      # ${VAR} becomes the EMPTY STRING, it does not stay literal and it does
      # not fall back to anything. With `optional: true` and the ConfigMap
      # missing, `accountId: ${CF_ACCOUNT_ID}` renders as `accountId: ""` and
      # Crossplane pushes that at the LIVE, deletionPolicy:Orphan Cloudflare
      # objects under cloud/.
      #
      # Left non-optional so it fails CLOSED: a missing ConfigMap stops the
      # Kustomization instead of silently blanking a live Access app. Note
      # cloud/vars.yaml ships the ConfigMap inside this very path, so on a
      # cold cluster it does not exist until this Kustomization's first
      # successful apply — which needs it. Break that by applying
      # cloud/vars.yaml (or an override ConfigMap) once, out of band, BEFORE
      # the first reconcile. Same shape as the cold-start traps in #9/#15:
      # fine forever on a cluster that already has it, fatal on a rebuild.
      - kind: ConfigMap
        name: basis-cloud-vars
        # basis ships cloud/vars.yaml with CF_ACCESS_TEAM:
        # evans-home.cloudflareaccess.com and CF_ACCOUNT_ID:
        # ed503c805407090970caf579da8193a8 as committed defaults — the live
        # evans-home account, so an unchanged apply is byte-identical to the
        # previously-hardcoded manifests. Override in the consuming repo to
        # point basis-cloud at a different Cloudflare account.
        #
        # Deliberately NOT templated: the crossplane.io/external-name
        # annotations and other UUIDs in cloud/10-access/cf-access-famevans.yaml
        # that adopt specific LIVE Cloudflare objects. Those identify the
        # exact adopted resource — if substitution were ever misconfigured, a
        # templated identity value risks crossplane re-pointing or failing to
        # adopt the live object, unlike accountId/team-domain which are plain
        # data fields. See the comment in that file for the full rationale.
